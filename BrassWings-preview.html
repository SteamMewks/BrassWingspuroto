function stick(a,b){

}

slice(2,'#ddbe87',[[-11,-17],[-8,-12],[0,-10],[8,-12],[11,-17],[0,-16]]);for(let y=2;y<9;y++)box(y,-.65,.65,-16+y*.35,-9-y*.12,'#545540');oval(4.5,2.8,4,-1,'#3b3030');oval(5,1.6,1.8,-2,'#84563a');

 }

const paletteCache=new Map();
function waterWeights(wx,wz){
 const u=Math.max(0,Math.min(99.999,wx/1000)),v=Math.max(0,Math.min(99.999,wz/1000)),i=Math.floor(u),j=Math.floor(v),dx=u-i,dz=v-j;
 const k=j*101+i,depth=(shoreDistance[k]*(1-dx)+shoreDistance[k+1]*dx)*(1-dz)+(shoreDistance[k+101]*(1-dx)+shoreDistance[k+102]*dx)*dz;
 const offshore=Math.min(1,Math.max(0,(depth-8)/53));
 const strait=Math.max(0,1-Math.hypot((wx-82800-400*Math.sin(wz/1900))/4500,(wz-50200)/7100))*(1-offshore);
 return [offshore,strait]
}
function seaZone(wx,wz){const [offshore,strait]=waterWeights(wx,wz);return offshore>.6?2:strait>.38?1:0}
function waterPalette(wx,wz){
 const w=waterWeights(wx,wz).map(v=>Math.round(v*16)),key=w.join(',');
 if(!paletteCache.has(key)){
  const [offshore,strait]=w,tints=seaTones[0].map((_,j)=>{
   const rgb=[16,8,0].map(shift=>seaTones.reduce((sum,row,i)=>sum+((row[j]>>shift)&255)*[16-offshore-strait,strait,offshore][i]/16,0));
   return 'rgb('+rgb.map(Math.round).join(',')+')'
  });paletteCache.set(key,tints)
 }
 return paletteCache.get(key)
}

const shoreRows=new Map(),shoreTiles=new Map();
function cutCoast(){
 shoreRows.clear();shoreTiles.clear();
 const m=operation();
 for(const coastRing of worldCoasts){
  const ring=coastRing.map(([X,Z])=>[X-m.wx,Z-m.wz]);
  let prev=ring[ring.length-1];
  for(const pt of ring){
   const edge=[prev,pt];
   for(let i=Math.floor(Math.min(prev[0],pt[0])/512);i<=Math.floor(Math.max(prev[0],pt[0])/512);i++){
    for(let j=Math.floor(Math.min(prev[1],pt[1])/512);j<=Math.floor(Math.max(prev[1],pt[1])/512);j++){
     const key=i+','+j;if(!shoreTiles.has(key))shoreTiles.set(key,[]);shoreTiles.get(key).push(edge)
    }
   }
   if(pt[1]!==prev[1])for(let row=Math.floor(Math.min(pt[1],prev[1])/128);row<=Math.floor(Math.max(pt[1],prev[1])/128);row++){
    if(!shoreRows.has(row))shoreRows.set(row,[]);
    shoreRows.get(row).push([prev,pt])
   }
   prev=pt
  }
  const xs=ring.map(p=>p[0]),zs=ring.map(p=>p[1]);
  const west=Math.min(...xs),east=Math.max(...xs),south=Math.min(...zs),north=Math.max(...zs);
  terraces.push({ring,cx:(west+east)/2,cz:(south+north)/2,rx:(east-west)/2,rz:(north-south)/2,y:10,mainland:true,color:'#81895c'})

 const enemy=locked?.hp?locked:enemies.filter(e=>e.hp>0).sort((a,b)=>Math.hypot(a.x-x,a.z-z)-Math.hypot(b.x-x,b.z-z))[0];
 patrolMap();const returningSupply=ammo<19||energy<26;const targetPlane=returningSupply?goalPort():enemy||zone,dir=Math.atan2(targetPlane.x-x,targetPlane.z-z)-yaw;
 $('place').textContent=(supplying?'補給中　':returningSupply?'補給地点へ（着陸後に補給）　':'空域 '+sector+'　')+(enemies.length?'撃墜 '+enemies.filter(e=>!e.hp).length+'/3':'指定空域へ')+'　'+['↑','↗','→','↘','↓','↙','←','↖'][(Math.round(dir/(tau/8))%8+8)%8]+' '+Math.round(Math.hypot(targetPlane.x-x,targetPlane.z-z))+' m'

 if(sortiePhase==='return'){
  const goal=approachReady?goalPort():zone,bearing=Math.atan2(goal.x-x,goal.z-z)-yaw;
  const arrow=['↑','↗','→','↘','↓','↙','←','↖'][(Math.round(bearing/(tau/8))%8+8)%8];
  $('place').textContent=(approachReady?((goalPort().deck?'艦尾':'滑走路')+'へ　高度32 m以下・推力42%以下'):('帰投　'+(goalPort().deck?'空母':goalPort().name)+'進入地点へ'))+'　'+arrow+' '+Math.round(Math.hypot(x-goal.x,z-goal.z))+' m'
 }else if(!enemies.length&&!returningSupply)$('place').textContent+='　任務 '+cleared+'/'+operation().waves;
 }else{worldMinimap();let dir=target?Math.atan2(target[0]-x,target[1]-z)-yaw:0;$('place').textContent=target?['↑','↗','→','↘','↓','↙','←','↖'][(Math.round(dir/(tau/8))%8+8)%8]+' '+target[2]+'　'+(nearest/1000).toFixed(1)+' km　'+'発見 '+found.size:'自由飛行'}
 if(deckMode&&live)$('place').textContent=deckMode==='capture'?(!landingSite.deck?'着陸補助　滑走路へ':'着艦補助　甲板へ'):deckMode==='moored'?(trial?landingSite.name+'　':supplying?'補給中　':'待機中　')+'推力72%以上で発進':(!landingSite.deck?'離陸中':'発艦中');
 $('feedback').textContent=t<messageUntil?message:'';
 const scoreboard=(mode==='combat'?'弾 '+Math.floor(ammo)+'　EN '+Math.ceil(energy)+'%　':'')+score+' pt';
 if($('score').textContent!==scoreboard)$('score').textContent=scoreboard}
buildWorld();parkAtStart();titleScreen();
function frame(now){if(live||(crash&&panel!=='crash')||!last||needsRedraw)draw(Math.min(.05,(now-last)/1000));needsRedraw=false;last=now;requestAnimationFrame(frame)}requestAnimationFrame(frame);
