<canvas></canvas><header><div><b>Brass Wings</b><small>群島飛行</small></div><strong id="meter"></strong><button id="sound" aria-label="サウンド切替" aria-pressed="false">音 OFF</button><button id="pause" aria-label="一時停止">Ⅱ</button></header><div id="place"></div><div id="feedback" role="status"></div><footer><div id="pad" aria-label="操縦桿"><i id="knob"></i></div><div style="display:grid;gap:6px"><button id="fire" hidden>射撃</button><strong id="score">0 pt</strong><label><span>推力</span><input id="thrust" type="range" min="0" max="100" value="0" aria-label="推力"></label></div></footer><div class="card" id="cover" role="dialog" aria-modal="true" aria-labelledby="panel-title"><article><small>夕 暮 れ の 飛 行</small><h1 id="panel-title">Brass Wings</h1><p>左右で旋回、上下で上昇・下降。<br>左右に素早く2回でロール、上に2回でループ。<br>右の推力レバーを上げて加速。射撃はボタンまたはスペースキー。<br>滑走路で停止した状態から開始。推力72%以上で発進し、自動上昇後に操縦できます。<br>作戦は各面で赤翼機6機を撃退し、指定の空母または基地へ帰投。低空・低推力で着陸補助。</p><div id="atlas"></div><div id="service" hidden><button id="repair">機関補修 · 1</button><button id="magazine">弾倉拡張 · 2</button></div><div class="actions"><button id="go" hidden>もう一度飛ぶ</button><button id="combat">作戦出撃・格納庫</button><button id="free">自由飛行</button><button hidden id="menu">タイトルへ</button></div></article></div><script>

function stick(a,b){
 const distance=Math.hypot(a,b),limit=Math.max(1,distance);

}

wing(-2);for(let y=0;y<9;y++)for(let s of [-1,1])for(let v of [0,1])box(y,s*(19+y*.12),s*(19+y*.12)+1,3+v*(1+y*.53),4+v*(1+y*.53),'#513e30');wing(9);
slice(2,'#ddbe87',[[-11,-17],[-8,-12],[0,-10],[8,-12],[11,-17],[0,-16]]);for(let y=2;y<9;y++)box(y,-.65,.65,-16+y*.35,-9-y*.12,'#545540');oval(4.5,2.8,4,-1,'#3b3030');oval(5,1.6,1.8,-2,'#84563a');

 }

 const r=Math.sqrt(1-(y/5)**2);

 }

let trick=null,phase=0,hand=1;
let tapDir='',tapAt=0,stickOut=false;
function resetGesture(){tapDir='';tapAt=0;stickOut=false}
function readGesture(rawX=ax,rawY=ay){
 if(!live||trick||deckMode){resetGesture();return}
 const u=rawX+Number(keys.has('ArrowRight'))-Number(keys.has('ArrowLeft'));
